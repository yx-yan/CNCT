# -----------------------------------------------------------------------------
# Dual-domain cascade training configuration.
#
# Consumed by: cnct.config.loader.load_training_cfg
#              → cnct.training.trainer (wired in step 8)
# -----------------------------------------------------------------------------

geometry_config: geometry.yaml   # relative to this file's directory

data:
  data_dir: /projects/CTdata/AbdomenCT-1K-ImagePart1   # GT NIfTI root (HU)
  proj_dir: /projects/CTdata/projection60              # sinograms (from cnct_dataprep)
  fdk_dir:  /projects/CTdata/fdk60                     # FDK recons (from cnct_dataprep)
  h5_root:  /projects/CTdata/h5_3dunet                 # for case-split discovery
  spatial_scale: 0.5      # Y,X downsample factor (1.0 = full res)
  mu_min: -0.02           # fixed-range mu normalisation lower bound
  mu_max:  0.08           # fixed-range mu normalisation upper bound

model:
  sinogram_out_features: 4                  # Branch A output feature channels
  sinogram_f_maps: [8, 16, 32, 64]          # Branch A U-Net feature maps
  volume_f_maps:   [8, 16, 32, 64, 128]     # Branch B U-Net feature maps
  num_groups: 8                             # GroupNorm group count
  use_checkpoint: true                      # block-level gradient checkpointing

loss:
  alpha: 1.0           # L1 weight
  beta: 0.2            # SSIM weight
  gamma: 1.0           # Edge weight
  ssim_window: 7       # 3D SSIM window (must be odd)

optimizer:
  lr: 2.0e-4
  weight_decay: 1.0e-5

scheduler:
  mode: max            # maximising val PSNR
  factor: 0.5
  patience: 10

# --- Training loop ---
epochs: 200
seed: 42
device: auto            # auto | cpu | cuda
checkpoint_dir: /projects/CTdata/dual_domain_checkpoints
resume: null            # path to a .pytorch checkpoint, or null
log_interval: 5
amp: true               # enable torch AMP autocast + GradScaler
