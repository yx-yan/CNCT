# -----------------------------------------------------------------------------
# Image-only baseline inference configuration.
#
# Identical to inference.yaml except checkpoint/output paths, so the
# image-only run (sbatch slurm/image_only/sbatch_predict.sh) reads from
# image_only_checkpoints/ and writes to a separate predictions/ directory.
# -----------------------------------------------------------------------------

geometry_config: geometry.yaml   # relative to this file's directory

base_dir: /projects/CTdata          # root data directory (change this for a new server)

data:
  data_dir: "{base_dir}/AbdomenCT-1K-Image"
  proj_dir: "{base_dir}/projection{n_angles}"
  fdk_dir:  "{base_dir}/fdk{n_angles}"
  h5_root:  "{base_dir}/h5_3dunet"
  spatial_scale: 0.5
  mu_min: -0.02
  mu_max:  0.08

model:
  sinogram_out_features: 4
  sinogram_f_maps: [8, 16, 32, 64, 128]
  volume_f_maps:   [8, 16, 32, 64, 128]
  num_groups: 8
  use_checkpoint: false   # no gradients during inference — disable for speed
  use_fdk: true            # must match the training config used for the checkpoint

checkpoint: "{base_dir}/image_only_checkpoints/best_checkpoint.pytorch"
output_dir: "{base_dir}/image_only_checkpoints/predictions"
split: test               # train | val | test
device: auto
amp: true

# Visualisation: also save axial/coronal/sagittal comparison PNGs and
# compute PSNR/SSIM against the GT NIfTI. Outputs go to
#   {output_dir}/visualizations/<CaseID>/pred_{axial,coronal,sagittal}.png
# and an aggregate {output_dir}/metrics.csv.
save_png: true
image_dpi: 150
