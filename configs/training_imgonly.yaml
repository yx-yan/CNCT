# -----------------------------------------------------------------------------
# Image-only baseline training configuration.
#
# Identical to training.yaml except checkpoint_dir, so the image-only run
# (sbatch slurm/image_only/sbatch_train.sh) does not overwrite the
# dual-domain checkpoints.
# -----------------------------------------------------------------------------

geometry_config: geometry.yaml   # relative to this file's directory

base_dir: /projects/CTdata          # root data directory (change this for a new server)

data:
  data_dir: "{base_dir}/AbdomenCT-1K-Image"   # GT NIfTI root (HU)
  proj_dir: "{base_dir}/projection{n_angles}"       # sinograms (auto-filled from geometry.n_angles)
  fdk_dir:  "{base_dir}/fdk{n_angles}"              # FDK recons (auto-filled from geometry.n_angles)
  h5_root:  "{base_dir}/h5_3dunet"                 # for case-split discovery
  spatial_scale: 0.5      # Y,X downsample factor (1.0 = full res)
  mu_min: -0.02           # fixed-range mu normalisation lower bound
  mu_max:  0.08           # fixed-range mu normalisation upper bound

model:
  sinogram_out_features: 4                  # Branch A output feature channels
  sinogram_f_maps: [8, 16, 32, 64, 128]          # Branch A U-Net feature maps
  volume_f_maps:   [8, 16, 32, 64, 128]     # Branch B U-Net feature maps
  num_groups: 8                             # GroupNorm group count
  use_checkpoint: true                      # block-level gradient checkpointing
  use_fdk: True                             # concat FDK prior + residual shortcut; set false to disable

loss:
  alpha: 1.0           # L1 weight
  beta: 0.2            # SSIM weight
  gamma: 1.0           # Edge weight
  ssim_window: 7       # 3D SSIM window (must be odd)

optimizer:
  lr: 2.0e-4
  weight_decay: 1.0e-5

scheduler:
  mode: max            # maximising val PSNR
  factor: 0.5
  patience: 10

# --- Training loop ---
epochs: 100
seed: 42
device: auto            # auto | cpu | cuda
checkpoint_dir: "{base_dir}/image_only_checkpoints"
# resume: "{base_dir}/image_only_checkpoints/last_checkpoint.pytorch"  # uncomment to resume from last checkpoint
resume: null            # path to a .pytorch checkpoint, or null
log_interval: 5
amp: true               # enable torch AMP autocast + GradScaler
early_stopping_patience: 20   # stop if val PSNR stalls for this many epochs
