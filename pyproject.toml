[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnct"
version = "0.1.0"
description = "Dual-domain cascaded network for sparse-view cone-beam CT reconstruction."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CNCT" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "h5py>=3.8",
    "nibabel>=5.0",
    "pyyaml>=6.0",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    # Note: `tigre` is installed from source on the cluster and is not a PyPI
    # dependency. It is required at runtime by cnct.models.dbp.
]

[project.scripts]
cnct-prepare-data = "cnct.cli.prepare:main"
cnct-train        = "cnct.cli.train:main"
cnct-predict      = "cnct.cli.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cnct = ["py.typed"]
