# -----------------------------------------------------------------------------
# Forward-projection pipeline parameters.
#
# Consumed by: cnct_dataprep.projection.forward  (CLI: scripts/run_projection.py)
# -----------------------------------------------------------------------------

# Relative path to the geometry config file (resolved from this file's directory).
geometry_config: geometry.yaml

# --- Paths ---
data_dir: /projects/CTdata/AbdomenCT-1K-ImagePart1   # input NIfTI root
proj_dir: /projects/CTdata/projection60              # output projections.npy root

# --- Acquisition ---
n_angles: 60         # number of projection angles distributed over 360 degrees

# --- Case selection ---
case_start: 0        # inclusive index into the sorted case list
case_end: null       # exclusive index; null = through the last case
max_cases: 400       # hard cap on cases after start/end slicing; null = no cap

# --- Output / visualisation ---
save_png: true          # save per-angle PNG visualisations alongside projections.npy
proj_save_every: 20     # save every Nth projection angle as PNG (when save_png is true)
image_dpi: 150          # DPI for all saved PNGs
