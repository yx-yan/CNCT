# -----------------------------------------------------------------------------
# FDK reconstruction pipeline parameters.
#
# Consumed by: cnct_dataprep.reconstruction.fdk  (CLI: scripts/run_fdk.py)
# -----------------------------------------------------------------------------

# Relative path to the geometry config file (resolved from this file's directory).
# Must match the geometry used for forward projection.
geometry_config: geometry.yaml

# --- Paths ---
base_dir: /projects/CTdata                            # root data directory (change this for a new server)
data_dir: "{base_dir}/AbdomenCT-1K-Image"             # NIfTI root (needed to rebuild per-case geometry)
proj_dir: "{base_dir}/projection{n_angles}"            # input projections.npy root (auto-filled from geometry.n_angles)
fdk_dir:  "{base_dir}/fdk{n_angles}"                   # output recon_fdk.npy root (auto-filled from geometry.n_angles)

# --- Reconstruction ---
# FDK backprojection filter: ram_lak | shepp_logan | cosine | hamming | hann
filter_name: ram_lak

# --- Case selection ---
case_start: 0
case_end: null
max_cases: null

# --- Output ---
save_png: False       # save reconstruction slice PNGs
save_nii: false      # save recon_fdk.nii.gz (large; disable to save disk space)
image_dpi: 150
