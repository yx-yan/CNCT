# -----------------------------------------------------------------------------
# FDK evaluation pipeline parameters.
#
# Consumed by: cnct_dataprep.evaluation.runner  (CLI: scripts/evaluate_fdk.py)
# -----------------------------------------------------------------------------

# Relative path to the geometry config file (resolved from this file's directory).
# Only geometry.mu_water is actually used by the evaluation pipeline (for the
# ground-truth HU -> mu conversion), but the composition keeps the config
# structure consistent with projection.yaml / fdk.yaml.
geometry_config: geometry.yaml

# --- Paths ---
base_dir: /projects/CTdata                            # root data directory (change this for a new server)
data_dir: "{base_dir}/AbdomenCT-1K-Image"             # ground-truth NIfTI root
fdk_dir:  "{base_dir}/fdk{n_angles}"                   # input recon_fdk.npy root (auto-filled from geometry.n_angles)
eval_dir: "{base_dir}/evaluation{n_angles}"            # output CSV + comparison PNGs (auto-filled from geometry.n_angles)

# --- Case selection ---
case_start: 0
case_end: null
max_cases: null

# --- Output ---
save_png: false       # save axial/coronal/sagittal comparison PNGs
image_dpi: 150
